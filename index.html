<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpediPro 95</title>
  <link rel="stylesheet" href="css/win98.css?v=0.15.38">
  <link rel="stylesheet" href="css/desktop.css?v=0.15.38">
  <link rel="stylesheet" href="css/apps/fuhrpark.css?v=0.15.38">
  <link rel="stylesheet" href="css/apps/tourenplanung.css?v=0.15.38">
  <link rel="stylesheet" href="css/apps/spielstaende.css?v=0.15.38">
  <link rel="stylesheet" href="css/apps/finanzen.css?v=0.15.38">
  <link rel="stylesheet" href="css/apps/auftraege.css?v=0.15.38">
</head>
<body>

  <div id="desktop">
    <!-- Desktop-Icons kommen hier später hin (Fuhrpark, Disposition, ...) -->
    <div id="desktop-icons">
      <div class="desktop-icon" id="icon-fuhrpark">
        <img class="desktop-icon-bild" src="assets/icons/fuhrpark.png" alt="Fuhrpark" width="48" height="48">
        <span class="desktop-icon-label">Fuhrpark</span>
      </div>
      <div class="desktop-icon" id="icon-tourenplanung">
        <img class="desktop-icon-bild" src="assets/icons/tourenplanung.png" alt="Disposition" width="48" height="48">
        <span class="desktop-icon-label">Disposition</span>
      </div>
      <div class="desktop-icon" id="icon-auftraege">
        <img class="desktop-icon-bild" src="assets/icons/auftraege.svg" alt="Aufträge" width="48" height="48">
        <span class="desktop-icon-label">Aufträge</span>
      </div>
      <div class="desktop-icon" id="icon-finanzen">
        <img class="desktop-icon-bild" src="assets/icons/finanzen.png" alt="Finanzen" width="48" height="48">
        <span class="desktop-icon-label">Finanzen</span>
      </div>
    </div>

    <!-- Fenster werden hier zur Laufzeit eingehängt -->
    <div id="window-layer"></div>
  </div>

  <div id="taskbar" class="bevel-out">
    <button id="start-button" class="win98-button bevel-out">
      <img class="start-flag" src="assets/icons/start-flag.svg" alt="" width="13" height="20"> Start
    </button>

    <div id="taskbar-windows"></div>

    <div id="tray">
      <span id="tray-version"></span>
      <span id="clock-date"></span>
      <span id="clock"></span>
    </div>
  </div>

  <div id="start-menu" class="hidden bevel-out">
    <div class="start-menu-side">SpediPro 95</div>
    <ul class="start-menu-items">
      <li class="has-submenu" id="programme-item">
        Programme &raquo;
        <ul class="submenu" id="programme-submenu">
          <!-- wird zur Laufzeit aus AppRegistry befüllt -->
        </ul>
      </li>
      <li class="disabled">Dokumente &raquo;</li>
      <li class="disabled">Einstellungen &raquo;</li>
      <li class="separator"></li>
      <li id="spielstaende-item">Spielstände...</li>
      <li class="separator"></li>
      <li id="shutdown-item">Beenden...</li>
    </ul>
  </div>

  <script src="js/core/version.js?v=0.15.38"></script>
  <script src="js/core/clock.js?v=0.15.38"></script>
  <script src="js/core/startmenu.js?v=0.15.38"></script>
  <script src="js/core/windowmanager.js?v=0.15.38"></script>
  <script src="js/core/appregistry.js?v=0.15.38"></script>
  <script src="js/core/verschleiss.js?v=0.15.38"></script>
  <script src="js/core/spielzeit.js?v=0.15.38"></script>
  <script src="js/core/fristen.js?v=0.15.38"></script>
  <script src="js/core/historie.js?v=0.15.38"></script>
  <script src="js/core/auslastung.js?v=0.15.38"></script>
  <script src="js/core/ausfall.js?v=0.15.38"></script>
  <script src="js/core/lackierung.js?v=0.15.38"></script>
  <script src="js/core/karte.js?v=0.15.38"></script>
  <script src="js/data/fahrzeugtypen.js?v=0.15.38"></script>
  <script src="js/data/staedte.js?v=0.15.38"></script>
  <script src="js/data/strassennetz.js?v=0.15.38"></script>
  <script src="js/data/gueter.js?v=0.15.38"></script>
  <script src="js/data/regionen.js?v=0.15.38"></script>
  <script src="js/data/kostensaetze.js?v=0.15.38"></script>
  <script src="js/core/wirtschaft.js?v=0.15.38"></script>
  <script src="js/core/betrieb.js?v=0.15.38"></script>
  <script src="js/core/finanzen.js?v=0.15.38"></script>
  <script src="js/core/ladung.js?v=0.15.38"></script>
  <script src="js/core/route.js?v=0.15.38"></script>
  <script src="js/core/fahrt.js?v=0.15.38"></script>
  <script src="js/core/kunden.js?v=0.15.38"></script>
  <script src="js/core/auftraege.js?v=0.15.38"></script>
  <script src="js/core/speicher.js?v=0.15.38"></script>
  <script src="js/apps/fuhrpark/fuhrpark.js?v=0.15.38"></script>
  <script src="js/apps/tourenplanung/tourenplanung.js?v=0.15.38"></script>
  <script src="js/apps/spielstaende/spielstaende.js?v=0.15.38"></script>
  <script src="js/apps/finanzen/finanzen.js?v=0.15.38"></script>
  <script src="js/apps/auftraege/auftraege.js?v=0.15.38"></script>
</body>
</html>
