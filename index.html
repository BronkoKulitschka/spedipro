<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpediPro 95</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/win98.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/apps/fuhrpark.css">
</head>
<body>

  <div id="desktop">
    <!-- Desktop-Icons kommen hier später hin (Fuhrpark, Tourenplanung, ...) -->
    <div id="desktop-icons">
      <div class="desktop-icon" id="icon-fuhrpark">
        <img class="desktop-icon-bild" src="assets/icons/fuhrpark.png" alt="Fuhrpark" width="48" height="48">
        <span class="desktop-icon-label">Fuhrpark</span>
      </div>
    </div>

    <!-- Fenster werden hier zur Laufzeit eingehängt -->
    <div id="window-layer"></div>
  </div>

  <div id="taskbar" class="bevel-out">
    <button id="start-button" class="win98-button bevel-out">
      <img class="start-flag" src="assets/icons/start-flag.svg" alt="" width="13" height="20"> Start
    </button>

    <div id="taskbar-windows"></div>

    <div id="tray">
      <span id="clock">--:--</span>
    </div>
  </div>

  <div id="start-menu" class="hidden bevel-out">
    <div class="start-menu-side">SpediPro 95</div>
    <ul class="start-menu-items">
      <li class="has-submenu" id="programme-item">
        Programme &raquo;
        <ul class="submenu" id="programme-submenu">
          <!-- wird zur Laufzeit aus AppRegistry befüllt -->
        </ul>
      </li>
      <li class="disabled">Dokumente &raquo;</li>
      <li class="disabled">Einstellungen &raquo;</li>
      <li class="separator"></li>
      <li id="shutdown-item">Beenden...</li>
    </ul>
  </div>

  <script src="js/core/clock.js"></script>
  <script src="js/core/startmenu.js"></script>
  <script src="js/core/windowmanager.js"></script>
  <script src="js/core/appregistry.js"></script>
  <script src="js/core/verschleiss.js"></script>
  <script src="js/core/spielzeit.js"></script>
  <script src="js/core/fristen.js"></script>
  <script src="js/core/historie.js"></script>
  <script src="js/core/auslastung.js"></script>
  <script src="js/core/ausfall.js"></script>
  <script src="js/core/lackierung.js"></script>
  <script src="js/data/fahrzeugtypen.js"></script>
  <script src="js/apps/fuhrpark/fuhrpark.js"></script>
</body>
</html>
