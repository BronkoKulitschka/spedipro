<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpediPro 95 – Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e6e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpediPro 95">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<div class="device">
  <div class="window">

    <!-- Titlebar -->
    <div class="titlebar">
      <svg class="truck-icon" viewBox="0 0 20 16" shape-rendering="crispEdges">
        <rect x="0" y="6" width="10" height="6" fill="#ffffff"/>
        <rect x="10" y="8" width="6" height="4" fill="#ffffff"/>
        <rect x="10" y="3" width="6" height="5" fill="#cfe0ff"/>
        <rect x="0" y="12" width="20" height="2" fill="#0a0e6e"/>
        <circle cx="4" cy="14" r="2" fill="#1a1a1a"/>
        <circle cx="14" cy="14" r="2" fill="#1a1a1a"/>
      </svg>
      <span class="title">SPEDIPRO 95</span>
      <button class="win-btn">?</button>
      <button class="win-btn">X</button>
      <span class="clock" id="clock">09:15</span>
    </div>

    <div class="content">

      <!-- Company panel -->
      <div class="panel">
        <div class="company">
          <svg width="46" height="40" viewBox="0 0 46 40" shape-rendering="crispEdges">
            <rect x="2" y="10" width="42" height="28" fill="#9a9488"/>
            <rect x="2" y="10" width="42" height="4" fill="#7a746a"/>
            <rect x="0" y="4" width="46" height="6" fill="#5a564e"/>
            <rect x="6" y="16" width="5" height="5" fill="#cfe0ff"/>
            <rect x="15" y="16" width="5" height="5" fill="#cfe0ff"/>
            <rect x="24" y="16" width="5" height="5" fill="#cfe0ff"/>
            <rect x="33" y="16" width="5" height="5" fill="#cfe0ff"/>
            <rect x="6" y="25" width="5" height="5" fill="#cfe0ff"/>
            <rect x="15" y="25" width="5" height="5" fill="#cfe0ff"/>
            <rect x="24" y="25" width="5" height="5" fill="#cfe0ff"/>
            <rect x="33" y="25" width="5" height="5" fill="#cfe0ff"/>
            <rect x="19" y="32" width="8" height="6" fill="#4a453e"/>
          </svg>
          <div>
            <div class="name">Spedition Müller GmbH</div>
            <div class="seat">Hauptsitz: Halle (DE)</div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="stat-row"><span class="label">Kontostand:</span><span class="value money">118.270,75 €</span></div>
        <div class="stat-row"><span class="label">Unternehmenswert:</span><span class="value neutral">2.845.600 €</span></div>
        <div class="stat-row"><span class="label">Ruf:</span><span class="stars">★★★★<span class="off">★</span></span></div>

        <div class="divider"></div>

        <div class="trio">
          <div class="trio-item"><div class="n">18</div><div class="l">Fahrzeuge</div></div>
          <div class="trio-sep"></div>
          <div class="trio-item"><div class="n">12</div><div class="l">Aktive Touren</div></div>
          <div class="trio-sep"></div>
          <div class="trio-item"><div class="n">24</div><div class="l">Mitarbeiter</div></div>
        </div>
      </div>

      <!-- Active tours map -->
      <div class="panel">
        <div class="section-title">Aktive Touren</div>
        <div class="map-frame">
          <svg viewBox="0 0 300 170" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
            <rect width="300" height="170" fill="#3f6fb0"/>
            <path d="M40 30 L90 20 L140 25 L180 15 L230 25 L270 40 L280 70 L260 110 L230 140 L190 155 L150 150 L110 155 L70 140 L45 110 L30 70 Z" fill="#5c9a4e"/>
            <path d="M60 140 L80 160 L100 158 L95 145 Z" fill="#5c9a4e"/>
            <path d="M15 60 L35 55 L38 90 L20 100 Z" fill="#5c9a4e"/>
            <g stroke="#e8e4d8" stroke-width="1" stroke-dasharray="3 2" opacity="0.7">
              <line x1="60" y1="30" x2="230" y2="130"/>
              <line x1="230" y1="30" x2="90" y2="140"/>
              <line x1="50" y1="90" x2="270" y2="80"/>
              <line x1="120" y1="20" x2="140" y2="150"/>
            </g>
            <rect x="70" y="35" width="7" height="7" fill="#e0a83c"/>
            <rect x="150" y="45" width="7" height="7" fill="#c93a3a"/>
            <rect x="200" y="55" width="7" height="7" fill="#3a5fc9"/>
            <rect x="110" y="80" width="7" height="7" fill="#e0a83c"/>
            <rect x="180" y="95" width="7" height="7" fill="#c93a3a"/>
            <rect x="90" y="115" width="7" height="7" fill="#3a5fc9"/>
            <rect x="230" y="100" width="7" height="7" fill="#e0a83c"/>
            <rect x="145" y="125" width="7" height="7" fill="#c93a3a"/>
          </svg>
        </div>
        <button class="btn-primary">🗺 TOURENPLANUNG STARTEN</button>
      </div>

      <!-- Nav grid (wird von dashboard.js befüllt) -->
      <div class="nav-grid" id="navGrid"></div>

    </div>

    <!-- Status bar -->
    <div class="statusbar">
      <span class="dot"></span>
      <span class="fill">Verbunden mit Spedipro-Netz</span>
      <span class="version" id="versionTag"></span>
      <span class="signal">
        <span style="height:4px"></span><span style="height:6px"></span>
        <span style="height:8px"></span><span style="height:11px"></span>
      </span>
    </div>

  </div>
</div>

<!-- Reihenfolge wichtig: icons.js und nav-data.js zuerst, dashboard.js nutzt beide -->
<script src="src/version.js"></script>
<script src="js/icons.js"></script>
<script src="js/nav-data.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/version-display.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
