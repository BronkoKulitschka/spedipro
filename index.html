<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<!-- Als eigene App installierbar. Auf GitHub Pages teilen sich alle
       Projekte eines Kontos dieselbe Herkunft — Benachrichtigungen
       gelten dort für die ganze Domäne. Als installierte App bekommt
       das Spiel einen eigenen Eintrag in den Systemeinstellungen. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#000080">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SpediPro 95">

  <title>SpeditionsPro 95</title>

<!-- Die Zahl hinter ?v= bei jeder neuen Fassung mit src/version.js
     gleichziehen. Dann lädt der Browser die Dateien sicher neu. -->
<!-- Leaflet liegt bei, statt von einem fremden Server zu kommen.
       Ohne die Bibliothek startet das Spiel gar nicht — sie darf
       deshalb nicht vom Netz abhängen. -->
  <link rel="stylesheet" href="./vendor/leaflet.css?v=0.28.0">
<link rel="stylesheet" href="./styles/win95.css?v=0.28.0">
<link rel="stylesheet" href="./styles/app.css?v=0.28.0">
<link rel="stylesheet" href="./styles/desktop.css?v=0.28.0">
</head>
<body>
  <div id="root"></div>
  <div id="toasts"></div>

  <script src="./vendor/leaflet.js?v=0.28.0"></script>
  <script type="module" src="./src/main.js?v=0.28.0"></script>
</body>
</html>
