<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"
     shape-rendering="crispEdges">
  <!-- Klemmbrett mit Frachtpapieren, im Pixelstil der übrigen Symbole.
       Bewusst SVG statt PNG: Das Symbol besteht nur aus Rechtecken,
       skaliert damit ohne Weichzeichnung und bleibt änderbar. -->
  <rect x="8"  y="6"  width="30" height="38" fill="#a08050"/>
  <rect x="9"  y="7"  width="28" height="36" fill="#c8a870"/>
  <rect x="12" y="11" width="22" height="29" fill="#f8f8f0"/>
  <rect x="12" y="11" width="22" height="29" fill="none" stroke="#5a5a4a" stroke-width="1"/>
  <!-- Klemme oben -->
  <rect x="18" y="3"  width="10" height="7" fill="#8890a0"/>
  <rect x="19" y="4"  width="8"  height="5" fill="#c0c8d8"/>
  <rect x="21" y="5"  width="4"  height="3" fill="#6a7280"/>
  <!-- Zeilen -->
  <rect x="15" y="16" width="16" height="2" fill="#30507a"/>
  <rect x="15" y="21" width="16" height="2" fill="#7a7a6a"/>
  <rect x="15" y="25" width="12" height="2" fill="#7a7a6a"/>
  <rect x="15" y="29" width="16" height="2" fill="#7a7a6a"/>
  <rect x="15" y="33" width="9"  height="2" fill="#2f8f3f"/>
  <rect x="27" y="33" width="4"  height="2" fill="#2f8f3f"/>
</svg>
